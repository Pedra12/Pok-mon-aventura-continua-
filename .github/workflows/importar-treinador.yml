name: Importar treinador Red 3D

on:
  push:
    paths:
      - '.github/workflows/importar-treinador.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: importar-treinador-red
  cancel-in-progress: false

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Baixar e validar modelo Red
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-all-errors \
            -o red_trainer.glb \
            https://raw.githubusercontent.com/jgyy/redgodot/main/godot/assets/models/characters/red.glb
          test -s red_trainer.glb
          python3 -m pip install --disable-pip-version-check pygltflib
          python3 - <<'PY'
          from pygltflib import GLTF2
          from pathlib import Path
          p = Path('red_trainer.glb')
          gltf = GLTF2().load(str(p))
          skins = len(gltf.skins or [])
          animations = len(gltf.animations or [])
          meshes = len(gltf.meshes or [])
          nodes = len(gltf.nodes or [])
          print(f'RED_MODEL bytes={p.stat().st_size} nodes={nodes} meshes={meshes} skins={skins} animations={animations}')
          print('ANIMATION_NAMES=' + ', '.join(a.name or '<unnamed>' for a in (gltf.animations or [])))
          if skins < 1:
              raise SystemExit('IMPORT_FAIL: modelo Red sem skin/esqueleto')
          if animations < 1:
              raise SystemExit('IMPORT_FAIL: modelo Red sem animações incorporadas')
          if nodes < 1:
              raise SystemExit('IMPORT_FAIL: estrutura glTF inválida')
          PY

      - name: Registrar créditos e adicionar modelo
        shell: bash
        run: |
          set -euo pipefail
          cat > CREDITOS_TREINADOR_RED.md <<'EOF'
          # Créditos do treinador Red

          Modelo 3D red_trainer.glb obtido do projeto https://github.com/jgyy/redgodot, de Jeffrey Goh.

          O projeto declara licença MIT para seu código e descreve os personagens humanos como modelos gerados proceduralmente a partir dos dados e designs do próprio projeto. O modelo foi copiado sem alteração. Consulte o repositório de origem e sua licença para os termos completos.

          Origem do arquivo: godot/assets/models/characters/red.glb.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add red_trainer.glb CREDITOS_TREINADOR_RED.md
          if git diff --cached --quiet; then
            echo 'Modelo e créditos já estão no repositório.'
          else
            git commit -m 'Add rigged and animated Red trainer model'
            git push origin HEAD:main
          fi

      - name: Disparar compilação Android após importar o treinador
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            /repos/Pedra12/Pok-mon-aventura-continua-/actions/workflows/build-android.yml/dispatches \
            -f ref=main
          echo 'ANDROID_BUILD_DISPATCHED=1'
