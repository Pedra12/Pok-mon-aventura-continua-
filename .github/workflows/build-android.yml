name: Compilar e validar APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'game/**'
      - 'config/pokemon_scale_profiles.json'
      - '*.glb'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar servidor grafico virtual
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Instalar e conferir plataformas Android
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          test -d "$ANDROID_SDK_ROOT/platforms/android-34"
          test -x "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt"
          test -x "$ANDROID_SDK_ROOT/platform-tools/adb"
          echo "ANDROID SDK OK: $ANDROID_SDK_ROOT"

      - name: Instalar Godot 4.4.1 e templates Android
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          curl -L --fail --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          sudo ln -sf /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_source.zip"
          test -s "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"
          test -s "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_release.apk"
          godot --version

      - name: Preparar assets e configuracao
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p game/assets game/config build
          find . -maxdepth 1 -type f -iname '*.glb' -print0 | while IFS= read -r -d '' f; do cp "$f" game/assets/; done
          cp config/pokemon_scale_profiles.json game/config/
          test -s game/assets/original_pokemon_village.glb
          test "$(find game/assets -maxdepth 1 -type f -iname '*.glb' | wc -l)" -eq 14
          ls -lh game/assets

      - name: Conferir configuracao da cena e Android
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'run/main_scene="res://Main.tscn"' game/project.godot
          grep -Fq 'window/handheld/orientation=0' game/project.godot
          grep -Fq 'renderer/rendering_method="gl_compatibility"' game/project.godot
          grep -Fq 'pointing/emulate_touch_from_mouse=true' game/project.godot
          grep -Fq 'const MAP_PATH := "res://assets/original_pokemon_village.glb"' game/Main.gd
          grep -Fq 'const POKEMON_FILES := [' game/Main.gd
          grep -Fq 'screen/orientation=0' game/export_presets.cfg
          grep -Fq 'textures/vram_compression/import_etc2_astc=true' game/project.godot
          echo "CONFIG_OK cena principal, landscape, GL Compatibility, touch, mapa e Squirtle"

      - name: Importar e validar projeto Godot
        run: |
          set -euo pipefail
          echo "IMPORT: iniciando importacao dos GLB"
          timeout 12m xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 godot --editor --path game --import --verbose
          echo "IMPORT: concluido; validando scripts"
          timeout 5m xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 godot --editor --path game --quit --verbose 2>&1 | tee /tmp/godot_validate.log
          if grep -E "SCRIPT ERROR:|Failed to load script|Parse Error:" /tmp/godot_validate.log; then echo "ERRO: script Godot invalido"; exit 1; fi
          echo "SMOKE: iniciando jogo por 5 frames"
          timeout 3m xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 godot --path game --quit-after 5 --verbose 2>&1 | tee /tmp/godot_smoke.log
          if grep -E "SCRIPT ERROR:|Failed to load script|Parse Error:" /tmp/godot_smoke.log; then echo "ERRO: script falhou no smoke test"; exit 1; fi
          echo "SCENE SMOKE: testando jogo completo, mapa, treinador, camera, Pokemon e HUD"
          timeout 3m godot --headless --path game --script res://tests/smoke_test.gd --verbose 2>&1 | tee /tmp/godot_scene_smoke.log
          if grep -E "SCRIPT ERROR:|Failed to load script|Parse Error:|SMOKE_FAIL:" /tmp/godot_scene_smoke.log; then echo "ERRO: teste da cena principal falhou"; exit 1; fi
          if ! grep -q "GAMEPLAY_SMOKE_OK scene=Main.tscn" /tmp/godot_scene_smoke.log; then echo "ERRO: teste nao confirmou o jogo completo"; cat /tmp/godot_scene_smoke.log; exit 1; fi
          echo "SCENE SMOKE: jogo completo, mapa, treinador, camera, Pokemon e HUD confirmados"

          echo "ANDROID TEMPLATE: verificando pacote oficial"
          test -s "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_source.zip"
          unzip -t "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_source.zip"
          echo "ANDROID TEMPLATE: pacote oficial íntegro; Godot fará a preparação no export"
          
      - name: Configurar SDK, keystore e template Android do Godot
        shell: bash
        run: |
          set -euo pipefail
          test -n "$JAVA_HOME"
          test -d "$ANDROID_SDK_ROOT/platforms/android-34"
          test -x "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt"
          test -x "$ANDROID_SDK_ROOT/platform-tools/adb"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.config/godot" "$HOME/.android" game/android/build
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cp "$HOME/.config/godot/editor_settings-4.tres" "$HOME/.config/godot/editor_settings-4.4.tres"
          echo "GODOT EDITOR SETTINGS:"
          cat "$HOME/.config/godot/editor_settings-4.4.tres"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          echo "::add-mask::$GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD"
          if [ ! -s "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" ]; then
            keytool -genkeypair -v -keystore "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" -storetype JKS -storepass "$GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD" -alias "$GODOT_ANDROID_KEYSTORE_DEBUG_USER" -keypass "$GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD" -dname "CN=Android Debug,O=Android,C=US" -validity 10000 -keyalg RSA -keysize 2048
          fi
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$GODOT_ANDROID_KEYSTORE_DEBUG_PATH"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=$GODOT_ANDROID_KEYSTORE_DEBUG_USER"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=$GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD"
          } >> "$GITHUB_ENV"
          keytool -list -keystore "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" -storepass "$GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD" -alias "$GODOT_ANDROID_KEYSTORE_DEBUG_USER"
          unzip -q "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_source.zip" -d game/android/build
          test -s game/android/build/build.gradle
          chmod +x game/android/build/gradlew
          touch game/android/build/.gdignore
          printf '%s\n' '4.4.1.stable' > game/android/.build_version
          test "$(tr -d '\r\n' < game/android/.build_version)" = "4.4.1.stable"
          echo "ANDROID BUILD TEMPLATE: instalado; marcador game/android/.build_version confirmado"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("game/export_presets.cfg")
          s = p.read_text()
          replacements = {
              'keystore/debug=""': 'keystore/debug="' + str(Path.home() / ".android/debug.keystore") + '"',
              'keystore/debug_user=""': 'keystore/debug_user="androiddebugkey"',
              'keystore/debug_password=""': 'keystore/debug_password="android"',
          }
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new)
              elif new.split("=")[0] not in s:
                  s = s.rstrip() + chr(10) + new + chr(10)
          p.write_text(s)
          PY
          grep -E '^keystore/debug' game/export_presets.cfg

      - name: Diagnostico completo antes do export Android
        shell: bash
        run: |
          set -euo pipefail
          echo "========== DIAGNOSTICO ANDROID GODOT 4.4.1: INICIO =========="
          echo "PWD=$(pwd)"
          echo "CAMINHO PROJECT.GODOT:"
          realpath game/project.godot
          echo "========== LS -LA GAME =========="
          ls -la game
          echo "========== LS -LA GAME/ANDROID =========="
          if [ -d game/android ]; then
            ls -la game/android
          else
            echo "AUSENTE: game/android"
          fi
          echo "========== LS -LA GAME/ANDROID/BUILD =========="
          if [ -d game/android/build ]; then
            ls -la game/android/build
          else
            echo "AUSENTE: game/android/build"
          fi
          echo "========== VERSAO DO TEMPLATE GRADLE =========="
          if [ -f game/android/.build_version ]; then
            echo "EXISTE: game/android/.build_version"
            cat game/android/.build_version
            template_version="$(tr -d '\r\n' < game/android/.build_version)"
            echo "VERSAO_LIDA=$template_version"
            if [ "$template_version" = "4.4.1.stable" ]; then
              echo "TEMPLATE_VERSION_MATCH=SIM"
            else
              echo "TEMPLATE_VERSION_MATCH=NAO (esperado 4.4.1.stable)"
            fi
          else
            echo "AUSENTE: game/android/.build_version"
          fi
          if [ -f game/android/build/.build_version ]; then
            echo "AVISO: marcador também encontrado em game/android/build/.build_version"
          fi

          echo "========== PRESET ANDROID COMPLETO (SENHAS REDIGIDAS) =========="
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("game/export_presets.cfg")
          lines = p.read_text().splitlines()
          sections = []
          current = None
          for line in lines:
              if line.startswith("[") and line.endswith("]"):
                  current = line
              if current and (current == "[preset.0]" or current == "[preset.0.options]"):
                  safe = re.sub(r'(?i)(keystore/[^=]*password\s*=\s*).*', r'\1"<REDACTED>"', line)
                  sections.append(safe)
          print(chr(10).join(sections))
          PY

          echo "========== EDITOR SETTINGS 4.4 =========="
          if [ -f "$HOME/.config/godot/editor_settings-4.4.tres" ]; then
            cat "$HOME/.config/godot/editor_settings-4.4.tres"
          else
            echo "AUSENTE: $HOME/.config/godot/editor_settings-4.4.tres"
          fi

          echo "========== VARIAVEIS DE AMBIENTE =========="
          echo "ANDROID_HOME=${ANDROID_HOME:-<UNSET>}"
          echo "JAVA_HOME=${JAVA_HOME:-<UNSET>}"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=${GODOT_ANDROID_KEYSTORE_DEBUG_PATH:-<UNSET>}"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=${GODOT_ANDROID_KEYSTORE_DEBUG_USER:-<UNSET>}"
          if [ -n "${GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD:-}" ]; then
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=<SET; REDACTED>"
          else
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=<UNSET>"
          fi

          echo "========== ARQUIVOS DO KEYSTORE =========="
          if [ -n "${GODOT_ANDROID_KEYSTORE_DEBUG_PATH:-}" ]; then
            ls -la "$(dirname "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH")"
            if [ -e "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" ]; then
              ls -l "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH"
              file "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH"
            else
              echo "KEYSTORE AUSENTE: $GODOT_ANDROID_KEYSTORE_DEBUG_PATH"
            fi
          else
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH nao definido"
          fi

          echo "========== ANDROID SDK: PLATFORMS =========="
          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME/platforms" ]; then
            ls -la "$ANDROID_HOME/platforms"
          else
            echo "PASTA platforms ausente ou ANDROID_HOME nao definido"
          fi
          echo "========== ANDROID SDK: BUILD-TOOLS =========="
          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME/build-tools" ]; then
            ls -la "$ANDROID_HOME/build-tools"
          else
            echo "PASTA build-tools ausente ou ANDROID_HOME nao definido"
          fi

          echo "========== JAVA VERSION =========="
          java -version 2>&1

          echo "========== GODOT EXPORT TEMPLATES =========="
          if [ -d "$HOME/.local/share/godot/export_templates" ]; then
            ls -la "$HOME/.local/share/godot/export_templates/"
          else
            echo "PASTA export_templates ausente"
          fi
          echo "========== CONTEUDO 4.4.1.STABLE =========="
          if [ -d "$HOME/.local/share/godot/export_templates/4.4.1.stable" ]; then
            ls -la "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          else
            echo "AUSENTE: export_templates/4.4.1.stable"
          fi
          echo "========== DIAGNOSTICO ANDROID GODOT 4.4.1: FIM =========="

      - name: Exportar APK Android com log completo
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p build
          echo "===== INICIO EXPORT GODOT 4.4.1 VERBOSE ====="
          set +e
          godot --headless --verbose --path game --export-debug "Android" "$GITHUB_WORKSPACE/build/PokemonAventura.apk" 2>&1
          export_status=$?
          set -e
          echo "===== FIM EXPORT GODOT; exit_code=$export_status ====="
          if [ "$export_status" -ne 0 ]; then
            echo "EXPORT FAILED: log acima reproduzido integralmente, sem grep, tail ou filtro."
            exit "$export_status"
          fi
          test -s build/PokemonAventura.apk
          file build/PokemonAventura.apk
          unzip -t build/PokemonAventura.apk
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt" dump badging build/PokemonAventura.apk

      - name: Publicar APK validado
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon-Aventura-Android
          path: build/PokemonAventura.apk
          if-no-files-found: error
          retention-days: 30
