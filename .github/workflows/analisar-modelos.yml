name: Analisar modelos 3D GLB

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analisar-modelos.yml'
      - 'tools/analyze_glb.py'
      - '**.glb'

permissions:
  contents: read

jobs:
  analisar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar analisadores glTF
        run: python -m pip install --upgrade pip pygltflib trimesh

      - name: Analisar todos os arquivos GLB
        run: python tools/analyze_glb.py

      - name: Publicar relatorios
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-modelos-3d
          path: analysis_output/
          if-no-files-found: error
          retention-days: 30
